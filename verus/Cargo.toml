[package]
name = "argon2-verification"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
vstd = { git = "https://github.com/verus-lang/verus", rev = "1888846b29c587f56d2a4c482e4b75ecd86f8543" }

[package.metadata.verus]
verify = true
fmt-as-rust = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }
