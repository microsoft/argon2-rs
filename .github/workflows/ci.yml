name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERUS_Z3_PATH: ${{ github.workspace }}/.verus-toolchain/source/z3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: verus-lang/verus
          ref: 1888846b29c587f56d2a4c482e4b75ecd86f8543
          path: .verus-toolchain
      - name: Build pinned Verus and vstd
        working-directory: .verus-toolchain/source
        run: |
          ./tools/get-z3.sh
          cargo build --release
          cargo run --release -p cargo-verus -- build --release --manifest-path vstd/Cargo.toml
          echo "$GITHUB_WORKSPACE/.verus-toolchain/source/target-verus/release" >> "$GITHUB_PATH"
      - name: Verify complete scalar implementation
        run: |
          "$VERUS_Z3_PATH" --version
          if grep -n 'exec_allows_no_decreases_clause' verus/lib.rs; then
            echo "Termination opt-out in the verification root" >&2
            exit 1
          fi
          cargo verus verify --manifest-path verus/Cargo.toml --locked --fwd-verus-args-to roots -- --no-cheating --rlimit 30

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- --deny warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Release tests
        run: cargo +stable test --locked --release
      - name: Documentation
        run: cargo +stable doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked --release

  portable-build:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-unknown-linux-gnu
      - run: cargo +stable check --locked --all-targets --target aarch64-unknown-linux-gnu

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable package --locked
      - name: Test the packaged artifact
        run: |
          cd target/package/argon2-verus-0.1.0
          cargo +stable test --locked --release
          RUSTDOCFLAGS="-D warnings" cargo +stable doc --locked --no-deps

  reference-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: P-H-C/phc-winner-argon2
          ref: 62358ba2123abd17fccf2a108a301d4b52c01a7c
          path: target/reference-argon2-20190702
      - name: Reproduce independent vectors
        run: |
          sh tools/reference-vectors.sh target/reference-argon2-20190702 > target/reference-vectors.tsv
          diff -u tests/reference/argon2-20190702.tsv target/reference-vectors.tsv

  dependency-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install cargo-vet --version 0.10.3 --locked
      - name: Check dependency audits (not a first-party security audit)
        run: cargo +stable vet --locked