name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Release tests
        run: cargo +stable test --locked --all-features --release
      - name: Minimal feature tests
        run: cargo +stable test --locked --no-default-features
      - name: Documentation
        run: cargo +stable doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked --all-features --release

  portable-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-unknown-linux-gnu
      - run: cargo +stable check --locked --target aarch64-unknown-linux-gnu

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable package --locked